name: CI
on: push
jobs:
  test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      mysql:
        image: mysql:8
        env: {MYSQL_ROOT_PASSWORD: pass, MYSQL_DATABASE: sails_sample}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ppass -h 127.0.0.1"
          --health-interval=5s --health-retries=5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Cache npm
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - run: npm ci
      - run: npm test
      - run: npm run coverage
      - name: Commit coverage badge
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add coverage/badges.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update coverage badge"
            if ! git pull --rebase; then
              git rebase --abort || true
              echo "Skipping badge push because rebase conflict occurred."
              exit 0
            fi
            if ! git push; then
              echo "Skipping badge push because branch was updated concurrently."
              exit 0
            fi
          fi
