name: CI
on: push
jobs:
  test:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    services:
      mysql:
        image: mysql:8
        env: {MYSQL_ROOT_PASSWORD: pass, MYSQL_DATABASE: sails_sample}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ppass -h 127.0.0.1"
          --health-interval=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm ci
      - name: Run tests
        run: |
          script -q -e -c "npm test" test-results.log
      - run: npm run coverage
      - name: Prepare PR comment
        run: |
          echo '## Test Results' > test-comment.md
          cat test-results.log >> test-comment.md
      - name: Find pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const branch = process.env.GITHUB_REF.replace('refs/heads/', '')
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open'
            })
            if (pulls.length) {
              core.setOutput('number', pulls[0].number.toString())
            }
      - name: Comment test results
        if: steps.pr.outputs.number
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          body-path: test-comment.md
          edit-mode: replace
      - name: Commit coverage badge
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add coverage/badges.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update coverage badge"
            git pull --rebase
            git push
          fi
