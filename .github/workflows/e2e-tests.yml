name: E2E Tests
on:
  pull_request:
    # `synchronize` means this workflow also runs when commits are pushed to an existing PR.
    types: [opened, synchronize, reopened]
jobs:
  e2e-tests:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
    services:
      mysql:
        image: mysql:8.4
        command: --mysql-native-password=ON
        env: {MYSQL_ROOT_PASSWORD: pass, MYSQL_DATABASE: sails_sample}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ppass -h 127.0.0.1"
          --health-interval=5s --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Resolve Playwright version
        id: playwright-version
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test']")
          PLAYWRIGHT_VERSION=${PLAYWRIGHT_VERSION#^}
          PLAYWRIGHT_VERSION=${PLAYWRIGHT_VERSION#~}
          echo "playwright_version=${PLAYWRIGHT_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.playwright_version }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - name: Install Playwright system dependencies
        run: npx playwright install-deps
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install
      - name: Configure MySQL user for mysql_native_password
        run: |
          mysql -h 127.0.0.1 -uroot -ppass -e "CREATE USER IF NOT EXISTS 'sails'@'%' IDENTIFIED WITH mysql_native_password BY 'pass';"
          mysql -h 127.0.0.1 -uroot -ppass -e "GRANT ALL PRIVILEGES ON sails_sample.* TO 'sails'@'%'; FLUSH PRIVILEGES;"
      - name: Run e2e tests
        env:
          MYSQL_URL: mysql://sails:pass@127.0.0.1:3306/sails_sample
        run: npm run e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
