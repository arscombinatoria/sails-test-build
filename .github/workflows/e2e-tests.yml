name: E2E Tests
on:
  pull_request:
    # `synchronize` means this workflow also runs when commits are pushed to an existing PR.
    types: [opened, synchronize, reopened]
jobs:
  e2e-tests:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:5.7
        env: {MYSQL_ROOT_PASSWORD: pass, MYSQL_DATABASE: sails_sample}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ppass -h 127.0.0.1"
          --health-interval=5s --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run e2e tests
        run: npm run e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
