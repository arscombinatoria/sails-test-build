name: E2E Tests
on:
  pull_request:
    # `synchronize` means this workflow also runs when commits are pushed to an existing PR.
    types: [opened, synchronize, reopened]
jobs:
  e2e-tests:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:5.7
        env: {MYSQL_ROOT_PASSWORD: pass, MYSQL_DATABASE: sails_sample}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ppass -h 127.0.0.1"
          --health-interval=5s --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
      - name: Install Playwright browsers and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps
      - name: Validate Playwright browsers from cache
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install
      - name: Run e2e tests
        run: npm run e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
