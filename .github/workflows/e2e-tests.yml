name: E2E Tests
on:
  pull_request:
    # `synchronize` means this workflow also runs when commits are pushed to an existing PR.
    types: [opened, synchronize, reopened]
jobs:
  e2e-tests:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright
    services:
      mysql:
        image: mysql:8.4
        command: --mysql-native-password=ON
        env: {MYSQL_ROOT_PASSWORD: pass, MYSQL_DATABASE: sails_sample}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -ppass -h 127.0.0.1"
          --health-interval=5s --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Resolve Playwright cache metadata
        id: playwright-meta
        shell: bash
        run: |
          set -euo pipefail
          PLAYWRIGHT_VERSION=$(node -e 'const lock=require("./package-lock.json"); const pkgs=lock.packages||{}; const rootDeps=(lock.packages?.[""]?.devDependencies)||{}; const candidates=["@playwright/test","playwright"]; let v="unknown"; for (const name of candidates){ if (rootDeps[name] && pkgs[`node_modules/${name}`]?.version){ v=pkgs[`node_modules/${name}`].version; break; } } process.stdout.write(v);')
          echo "version=${PLAYWRIGHT_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: .cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-meta.outputs.version }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('playwright.config.*') }}
      - name: Install Playwright system dependencies
        run: npx playwright install-deps
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install
      - name: Configure MySQL user for mysql_native_password
        run: |
          mysql -h 127.0.0.1 -uroot -ppass -e "CREATE USER IF NOT EXISTS 'sails'@'%' IDENTIFIED WITH mysql_native_password BY 'pass';"
          mysql -h 127.0.0.1 -uroot -ppass -e "GRANT ALL PRIVILEGES ON sails_sample.* TO 'sails'@'%'; FLUSH PRIVILEGES;"
      - name: Run e2e tests
        env:
          MYSQL_URL: mysql://sails:pass@127.0.0.1:3306/sails_sample
        run: npm run e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
