name: Semgrep (reviewdog)

on:
  pull_request:
    # PR 作成 / 更新 / 再オープン / Draft→Ready for review で実行
    types: [opened, synchronize, reopened, ready_for_review]

# 最小権限: コード取得とPRコメント投稿に必要な範囲だけ付与
permissions:
  contents: read
  pull-requests: write

jobs:
  semgrep:
    runs-on: ubuntu-latest

    # 失敗時にCIを止めるかを切替しやすいようにenv化
    # true: ERROR以上の指摘でジョブ失敗
    # false: 指摘はコメントのみ（advisory-only）
    env:
      FAIL_ON_FINDINGS: "false"

    steps:
      # pull_request イベントでPRのHEADコミットをチェックアウト
      # pull_request_target は使わない（fork PRの安全性を優先）
      - name: Checkout PR HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # 3系の最新パッチを利用
          python-version: "3.x"

      # requirements.txt / pyproject.toml がないリポジトリでも失敗しないよう
      # setup-python の pip cache 機能ではなく actions/cache を利用する
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-semgrep-${{ hashFiles('.github/workflows/semgrep-reviewdog.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-semgrep-

      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Set up reviewdog
        uses: reviewdog/action-setup@v1.5.0

      - name: Run Semgrep (SARIF)
        run: semgrep scan --config auto --sarif . > semgrep.sarif

      # 同一リポジトリからのPRのみレビューコメントを書き込む
      - name: reviewdog (PR review comments for trusted PRs)
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail

          REVIEWDOG_FAIL_LEVEL="none"
          if [ "${FAIL_ON_FINDINGS}" = "true" ]; then
            REVIEWDOG_FAIL_LEVEL="error"
          fi

          reviewdog \
              -f=sarif \
              -name="semgrep" \
              -reporter=github-pr-review \
              -filter-mode=diff_context \
              -level=warning \
              -fail-level="${REVIEWDOG_FAIL_LEVEL}" \
              < semgrep.sarif

      # fork PR / Dependabot PR は書き込み不可トークンになりうるため非書き込みレポーターに切替
      - name: reviewdog (local report for untrusted PRs)
        if: ${{ github.event.pull_request.head.repo.full_name != github.repository || github.actor == 'dependabot[bot]' }}
        run: |
          set -o pipefail

          REVIEWDOG_FAIL_LEVEL="none"
          if [ "${FAIL_ON_FINDINGS}" = "true" ]; then
            REVIEWDOG_FAIL_LEVEL="error"
          fi

          reviewdog \
              -f=sarif \
              -name="semgrep" \
              -reporter=local \
              -level=warning \
              -fail-level="${REVIEWDOG_FAIL_LEVEL}" \
              < semgrep.sarif
