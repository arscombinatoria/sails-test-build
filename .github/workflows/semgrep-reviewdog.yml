name: Semgrep (reviewdog)

on:
  pull_request:
    # PR 作成 / 更新 / 再オープン / Draft→Ready for review で実行
    types: [opened, synchronize, reopened, ready_for_review]

# 最小権限: コード取得とPRコメント投稿に必要な範囲だけ付与
permissions:
  contents: read
  pull-requests: write

jobs:
  semgrep:
    runs-on: ubuntu-latest

    # 失敗時にCIを止めるかを切替しやすいようにenv化
    # true: ERROR以上の指摘でジョブ失敗
    # false: 指摘はコメントのみ（advisory-only）
    env:
      FAIL_ON_FINDINGS: "false"

    steps:
      # pull_request イベントでPRのHEADコミットをチェックアウト
      # pull_request_target は使わない（fork PRの安全性を優先）
      - name: Checkout PR HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # 3系の最新パッチを利用
          python-version: "3.x"
          # pip キャッシュを有効化してインストールを高速化
          cache: "pip"

      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Set up reviewdog
        uses: reviewdog/action-setup@v1.5.0

      - name: Run Semgrep and annotate PR diff with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail

          REVIEWDOG_FAIL_LEVEL="none"
          if [ "${FAIL_ON_FINDINGS}" = "true" ]; then
            REVIEWDOG_FAIL_LEVEL="error"
          fi

          semgrep scan \
            --config auto \
            --sarif \
            . \
          | reviewdog \
              -f=sarif \
              -name="semgrep" \
              -reporter=github-pr-review \
              -filter-mode=diff_context \
              -level=warning \
              -fail-level="${REVIEWDOG_FAIL_LEVEL}"
