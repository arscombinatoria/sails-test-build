name: Semgrep (reviewdog)

on:
  pull_request:
    # PR 作成 / 更新 / 再オープン / Draft→Ready for review で実行
    types: [opened, synchronize, reopened, ready_for_review]

# 最小権限: コード取得とPRコメント投稿に必要な範囲だけ付与
permissions:
  contents: read
  pull-requests: write

jobs:
  semgrep:
    runs-on: ubuntu-latest

    # 失敗時にCIを止めるかを切替しやすいようにenv化
    # true: reviewdogが違反を検知してもジョブ継続
    # false: reviewdogが違反を検知したらジョブ失敗
    env:
      FAIL_ON_FINDINGS: "false"

    steps:
      # pull_request イベントでPRのHEADコミットをチェックアウト
      # pull_request_target は使わない（fork PRの安全性を優先）
      - name: Checkout PR HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Set up reviewdog
        uses: reviewdog/action-setup@v1.5.0

      - name: Run Semgrep and annotate PR diff with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          semgrep scan \
            --config auto \
            --json \
            . \
          | reviewdog \
              -f=semgrep \
              -name="semgrep" \
              -reporter=github-pr-review \
              -filter-mode=diff_context \
              -fail-level=error \
              -level=warning \
              -fail-on-error="${FAIL_ON_FINDINGS}"
