name: semgrep(reviewdog)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: reviewdog/action-setup@v1
      - uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/default
      - name: Run reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semgrep --config p/default --json | \
            reviewdog -f=semgrep -name="semgrep" -reporter=github-pr-review -fail-level=warning
