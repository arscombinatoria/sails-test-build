name: semgrep-reviewdog

on:
  pull_request:
    # PR 作成・更新・再オープン・Ready for review で実行
    types: [opened, synchronize, reopened, ready_for_review]

# トークン権限は最小限 (PR へのレビューコメント投稿に必要な権限のみ)
permissions:
  contents: read
  pull-requests: write

jobs:
  semgrep:
    runs-on: ubuntu-latest

    # Draft PR では不要ならスキップ (ready_for_review で再実行)
    if: github.event.pull_request.draft == false

    env:
      # CI を fail させるかどうかをこのフラグで切り替え可能
      # true  : 指摘があればジョブ失敗
      # false : 指摘があってもジョブ成功 (コメントのみ)
      FAIL_ON_FINDINGS: "false"

    steps:
      - name: Checkout PR HEAD safely
        uses: actions/checkout@v6
        with:
          # pull_request イベントの head SHA を明示的に取得
          # (fork PR でも安全に PR のコードを読み取り専用で解析)
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Install reviewdog
        env:
          REVIEWDOG_VERSION: v0.21.0
        run: |
          curl -sfL "https://github.com/reviewdog/reviewdog/releases/download/${REVIEWDOG_VERSION}/reviewdog_${REVIEWDOG_VERSION#v}_Linux_x86_64.tar.gz" \
            | tar -xz
          sudo mv reviewdog /usr/local/bin/reviewdog
          reviewdog -version

      - name: Run Semgrep and post PR review comments
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail

          # Semgrep の結果を reviewdog が扱える rdjson 形式で出力
          semgrep scan \
            --config auto \
            --json \
            > semgrep.json

          # reviewdog が差分行のみにコメント
          reviewdog \
            -f=semgrep \
            -name="semgrep" \
            -reporter=github-pr-review \
            -filter-mode=diff_context \
            -fail-on-error="${FAIL_ON_FINDINGS}" \
            < semgrep.json
