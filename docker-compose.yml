services:
  db:
    image: mysql:8.4
    command: --mysql-native-password=ON
    ports: ["13306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: sails_sample
    healthcheck:
      test: ["CMD","mysqladmin","ping","-ppass","-h","localhost"]
      interval: 5s
      retries: 5
