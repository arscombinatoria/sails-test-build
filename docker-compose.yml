services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    ports: ["13306:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: sails_sample
    healthcheck:
      test: ["CMD","mysqladmin","ping","-ppass","-h","localhost"]
      interval: 5s
      retries: 5
